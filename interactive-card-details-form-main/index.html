<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./src/styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Interactive card details form</title>
</head>
<body class="page">
<section class="preview-section">
  <div class="cards-wrapper">
    <div class="card card-front">
      <img src="images/bg-card-front.png" alt="card-front"/>
      <div class="card-front__body">
        <div class="card-front__image">
          <img src="images/card-logo.svg" alt="card-logo"/>
        </div>

        <div class="card-front__content">
          <p class="card-front__code">
            0000 0000 0000 0000
          </p>
          <div class="card-front__description">
            <div class="card-name">
              Jane Appleseed
            </div>
            <div class="card-point">
              00/00
            </div>
          </div>
        </div>

      </div>

    </div>
    <div class="card card-back">
      <img src="images/bg-card-back.png" alt="card-back"/>
      <p class="card-back__code">000</p>

    </div>
  </div>
</section>

<section class="form-section">
  <form method="post" class="card-form">
    <div class="form-group">
      <label for="cardholder-name">Cardholder Name</label>
      <input id="cardholder-name" required autocomplete="cc-name" aria-describedby="name-error" name="name" type="text" placeholder="e.g. Jane Appleseed"/>
    </div>
    <div class="form-group">
      <label for="card-number">Card Number</label>
      <input id="card-number" required autocomplete="cc-number" aria-describedby="card-number-error" name="card-number" type="number" placeholder="e.g. 1234 5678 9123 0000"/>
    </div>
    <div class="form-row">
      <fieldset class="exp-group">
        <legend >Exp. Date (MM/YY)</legend>
        <div class="exp-group__input">
          <div>
            <label for="exp-month" class="sr-only">
              Expiration month
            </label>
            <input id="exp-month" required autocomplete="cc-exp-month" aria-describedby="month-number-error" name="month-number" type="text" inputmode="numeric" maxlength="2" placeholder="MM"/>
          </div>

          <div>
            <label for="exp-year" class="sr-only">
              Expiration year
            </label>
            <input id="exp-year" required autocomplete="cc-exp-year" aria-describedby="year-number-error" name="year-number" type="text" inputmode="numeric" maxlength="2" placeholder="YY"/>
          </div>
        </div>
      </fieldset>
      <div class="cvc-group">
        <label for="cvc-number">CVC</label>
        <input id="cvc-number" required autocomplete="cc-csc" aria-describedby="cvc-number-error" name="cvc-number" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 123"/>
      </div>
    </div>
    <button type="submit" class="card-form__confirm">Confirm</button>
  </form>
</section>

</body>
</html>
