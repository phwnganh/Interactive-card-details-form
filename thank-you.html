<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/style.css">
    <title>Thank You</title>
</head>
<body class="page">
<main class="main-container">
    <section class="preview-section">
        <div class="cards-wrapper">
            <div class="card card-back">
                <img src="images/bg-card-back.png" alt="card-back"/>
                <p class="card-back__code">000</p>

            </div>

            <div class="card card-front">
                <img src="images/bg-card-front.png" alt="card-front"/>
                <div class="card-front__body">
                    <div class="card-front__image">
                        <img src="images/card-logo.svg" alt="card-logo"/>
                    </div>

                    <div class="card-front__content">
                        <p class="card-front__code">
                            0000 0000 0000 0000
                        </p>
                        <div class="card-front__description">
                            <div class="card-front__name">
                                Jane Appleseed
                            </div>
                            <div class="card-front__point">
                                00/00
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </section>

    <section class="thank-you-section">
        <div class="thank-you-form">
            <div class="thank-you__icon">
                <img src="images/icon-complete.svg" alt="complete icon"/>
            </div>
            <div class="thank-you__content">
                <h1 class="thank-you__title">Thank you!</h1>
                <p class="thank-you__description">We've added your card details</p>
            </div>

            <button type="submit" class="thank-you__submit">
                Continue
            </button>
        </div>

    </section>
</main>


<script type="module" src="./src/components/thank-you/thank-you.js"></script>
</body>
</html>
